<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1300" width="2000" height="1300" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>A307 노카 시스템 구성도</title>
  <desc>사용자(Vue 3 SPA) · 백엔드 서비스(Nginx·Spring Boot·Redis) · AI 서버(FastAPI·YOLO·ROI 임베딩) · Amazon S3 · PostgreSQL+pgvector · 오프라인 데이터 파이프라인의 관계와 요청 흐름</desc>

  <defs>
    <marker id="ah-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
    <marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#14B8A6"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/>
    </marker>
  </defs>

  <rect width="2000" height="1300" fill="#FFFFFF"/>

  <!-- ══════════ Amazon S3 ══════════ -->
  <rect x="440" y="55" width="1490" height="205" rx="14" fill="#FFFBF3" stroke="#D97706" stroke-width="2.5"/>
  <text x="472" y="103" font-size="27" font-weight="700" fill="#B45309">Amazon S3</text>

  <rect x="476" y="124" width="674" height="96" rx="10" fill="#FFFFFF" stroke="#FBBF24" stroke-width="2"/>
  <text x="504" y="163" font-size="21" font-weight="700" fill="#B45309">staging</text>
  <text x="504" y="196" font-size="16" fill="#78350F">사용자가 직접 올린 원본 · 7일 후 자동 삭제</text>

  <rect x="1200" y="124" width="690" height="96" rx="10" fill="#FFFFFF" stroke="#FBBF24" stroke-width="2"/>
  <text x="1228" y="163" font-size="21" font-weight="700" fill="#B45309">service</text>
  <text x="1228" y="196" font-size="16" fill="#78350F">검증된 원본 · 리사이즈 · 썸네일 · 사례 이미지</text>

  <!-- ══════════ 사용자 ══════════ -->
  <rect x="35" y="540" width="240" height="236" rx="14" fill="#FFFFFF" stroke="#374151" stroke-width="2.5"/>
  <text x="155" y="594" font-size="24" font-weight="700" fill="#111827" text-anchor="middle">사용자</text>
  <text x="155" y="628" font-size="18" fill="#374151" text-anchor="middle">Vue 3 SPA</text>
  <line x1="62" y1="654" x2="248" y2="654" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="155" y="686" font-size="15" fill="#4B5563" text-anchor="middle">원본 이미지 + 좌표 JSON으로</text>
  <text x="155" y="710" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">손상 영역을 직접 그림</text>
  <text x="155" y="742" font-size="15" fill="#6B7280" text-anchor="middle">오버레이 이미지 없음</text>

  <!-- ══════════ EC2 1 · 백엔드 ══════════ -->
  <rect x="440" y="340" width="465" height="620" rx="14" fill="#F5F6FF" stroke="#6366F1" stroke-width="2.5"/>
  <text x="672" y="390" font-size="25" font-weight="700" fill="#4338CA" text-anchor="middle">EC2 1 · 백엔드 서비스</text>

  <rect x="470" y="426" width="405" height="70" rx="10" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2"/>
  <text x="672" y="469" font-size="21" font-weight="700" fill="#3730A3" text-anchor="middle">Nginx</text>
  <line x1="672" y1="500" x2="672" y2="530" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#ah-dark)"/>

  <rect x="470" y="536" width="405" height="70" rx="10" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2"/>
  <text x="672" y="579" font-size="21" font-weight="700" fill="#3730A3" text-anchor="middle">Spring Boot API</text>
  <line x1="672" y1="610" x2="672" y2="640" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#ah-dark)"/>

  <rect x="470" y="646" width="405" height="90" rx="10" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2"/>
  <text x="672" y="682" font-size="21" font-weight="700" fill="#3730A3" text-anchor="middle">Redis</text>
  <text x="672" y="712" font-size="16" fill="#4F46E5" text-anchor="middle">세션 저장소 (Spring Session)</text>

  <text x="672" y="792" font-size="17" fill="#4338CA" text-anchor="middle">수신 · 저장 · 조회 · 리포트</text>
  <text x="672" y="820" font-size="17" fill="#6366F1" text-anchor="middle">S3 key 규칙을 통제</text>
  <text x="672" y="848" font-size="16" fill="#6366F1" text-anchor="middle">작업 큐·상태는 PostgreSQL 폴링</text>

  <!-- ══════════ EC2 2 · AI 서버 ══════════ -->
  <rect x="1050" y="340" width="475" height="620" rx="14" fill="#F2FDF8" stroke="#34D399" stroke-width="2.5"/>
  <text x="1287" y="390" font-size="25" font-weight="700" fill="#065F46" text-anchor="middle">EC2 2 · AI 서버</text>

  <rect x="1080" y="426" width="415" height="66" rx="10" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="2"/>
  <text x="1287" y="467" font-size="21" font-weight="700" fill="#065F46" text-anchor="middle">FastAPI · /analyze</text>

  <path d="M1287,492 V516 H1177 V540" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#ah-green)"/>
  <path d="M1287,492 V516 H1397 V540" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#ah-green)"/>

  <rect x="1080" y="546" width="195" height="78" rx="10" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="2"/>
  <text x="1177" y="578" font-size="19" font-weight="700" fill="#065F46" text-anchor="middle">YOLO ① 부품</text>
  <text x="1177" y="605" font-size="16" fill="#047857" text-anchor="middle">Detection</text>

  <rect x="1300" y="546" width="195" height="78" rx="10" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="2"/>
  <text x="1397" y="578" font-size="19" font-weight="700" fill="#065F46" text-anchor="middle">YOLO ② 손상</text>
  <text x="1397" y="605" font-size="16" fill="#047857" text-anchor="middle">Segmentation</text>

  <path d="M1177,624 V648 H1287 V664" fill="none" stroke="#10B981" stroke-width="2.5"/>
  <path d="M1397,624 V648 H1287" fill="none" stroke="#10B981" stroke-width="2.5"/>
  <line x1="1287" y1="648" x2="1287" y2="666" stroke="#10B981" stroke-width="2.5" marker-end="url(#ah-green)"/>

  <rect x="1080" y="672" width="415" height="74" rx="10" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="2"/>
  <text x="1287" y="703" font-size="19" font-weight="700" fill="#065F46" text-anchor="middle">부품 · 손상 매칭 → ROI 임베딩</text>
  <text x="1287" y="730" font-size="16" fill="#047857" text-anchor="middle">bbox · 폴리곤 · 벡터 생성</text>

  <line x1="1287" y1="750" x2="1287" y2="780" stroke="#10B981" stroke-width="2.5" marker-end="url(#ah-green)"/>

  <rect x="1080" y="786" width="415" height="76" rx="10" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="2"/>
  <text x="1287" y="817" font-size="19" font-weight="700" fill="#065F46" text-anchor="middle">유사 사례 검색 · 견적 산정</text>
  <text x="1287" y="845" font-size="16" fill="#047857" text-anchor="middle">메타데이터 필터 + 벡터 유사도</text>

  <text x="1287" y="912" font-size="17" font-weight="700" fill="#065F46" text-anchor="middle">S3 · DB 쓰기 없음 — 읽기만</text>

  <!-- ══════════ 데이터 파이프라인 ══════════ -->
  <rect x="1590" y="340" width="345" height="240" rx="14" fill="#F3FDF5" stroke="#22C55E" stroke-width="2.5"/>
  <text x="1762" y="386" font-size="23" font-weight="700" fill="#15803D" text-anchor="middle">데이터 파이프라인</text>
  <text x="1762" y="414" font-size="17" fill="#16A34A" text-anchor="middle">오프라인 배치</text>
  <line x1="1622" y1="436" x2="1903" y2="436" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="1762" y="470" font-size="16" fill="#166534" text-anchor="middle">AI-Hub 사례 적재 · 표준화</text>
  <text x="1762" y="498" font-size="16" fill="#166534" text-anchor="middle">검색 코퍼스 · ROI 임베딩</text>
  <text x="1762" y="526" font-size="16" fill="#166534" text-anchor="middle">비용 통계 산출</text>
  <text x="1762" y="554" font-size="16" fill="#4ADE80" text-anchor="middle">서비스 요청 경로 밖</text>

  <!-- ══════════ PostgreSQL ══════════ -->
  <rect x="440" y="1035" width="1090" height="212" rx="14" fill="#F3FDF5" stroke="#16A34A" stroke-width="2.5"/>
  <text x="476" y="1090" font-size="27" font-weight="700" fill="#15803D">PostgreSQL + pgvector</text>
  <text x="476" y="1132" font-size="17" fill="#166534">· 사고 · 분석 · 견적 — 검출 좌표는 analysis_image_result.detections JSONB</text>
  <text x="476" y="1168" font-size="17" fill="#166534">· AI-Hub 수리 사례 · 비용 통계</text>
  <text x="476" y="1204" font-size="17" fill="#166534">· 유사 사례 검색용 ROI 벡터 · 분석/PDF 작업 큐(@Scheduled 폴링 + 조건부 UPDATE 선점)</text>

  <!-- ══════════ 흐름 ══════════ -->
  <!-- ① 사용자 → 백엔드 -->
  <line x1="277" y1="560" x2="434" y2="560" stroke="#111827" stroke-width="2.5" marker-end="url(#ah-dark)"/>
  <text x="355" y="548" font-size="16" fill="#111827" text-anchor="middle">① API 요청</text>

  <!-- ② 브라우저 → S3 staging -->
  <path d="M168,538 V180 H470" fill="none" stroke="#14B8A6" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#ah-teal)"/>
  <text x="196" y="356" font-size="16" fill="#0F766E">② 브라우저가</text>
  <text x="196" y="379" font-size="16" fill="#0F766E">직접 PUT</text>

  <!-- ③ 백엔드 → S3 -->
  <line x1="628" y1="338" x2="628" y2="266" stroke="#14B8A6" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#ah-teal)"/>
  <text x="648" y="306" font-size="16" fill="#0F766E">③ 검증 · 전처리 후 복사</text>

  <!-- ④ 백엔드 → AI -->
  <line x1="907" y1="560" x2="1044" y2="560" stroke="#111827" stroke-width="2.5" marker-end="url(#ah-dark)"/>
  <text x="975" y="533" font-size="16" fill="#111827" text-anchor="middle">④ 분석 요청</text>
  <text x="975" y="556" font-size="15" fill="#4B5563" text-anchor="middle">202 Accepted</text>

  <!-- ⑤ S3 → AI -->
  <line x1="1340" y1="264" x2="1340" y2="334" stroke="#14B8A6" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#ah-teal)"/>
  <text x="1358" y="306" font-size="16" fill="#0F766E">⑤ 이미지 읽기</text>

  <!-- ⑥ AI → 백엔드 -->
  <line x1="1044" y1="786" x2="911" y2="786" stroke="#111827" stroke-width="2.5" marker-end="url(#ah-dark)"/>
  <text x="978" y="812" font-size="16" fill="#111827" text-anchor="middle">⑥ 콜백 (비동기)</text>
  <text x="978" y="835" font-size="14" fill="#4B5563" text-anchor="middle">POST /internal/analysis-jobs/{jobId}/result</text>

  <!-- ⑦ 백엔드 → DB -->
  <line x1="628" y1="962" x2="628" y2="1030" stroke="#111827" stroke-width="2.5" marker-end="url(#ah-dark)"/>
  <text x="648" y="1004" font-size="16" fill="#111827">⑦ 저장 · 조회</text>

  <!-- ⑧ 백엔드 → 사용자 -->
  <line x1="434" y1="778" x2="279" y2="778" stroke="#111827" stroke-width="2.5" marker-end="url(#ah-dark)"/>
  <text x="356" y="803" font-size="16" fill="#111827" text-anchor="middle">⑧ 견적 + 좌표</text>

  <!-- AI → DB -->
  <line x1="1287" y1="962" x2="1287" y2="1030" stroke="#111827" stroke-width="2.5" marker-end="url(#ah-dark)"/>
  <text x="1306" y="998" font-size="16" fill="#111827">사례 검색 조회</text>
  <text x="1306" y="1021" font-size="15" fill="#4B5563">메타데이터 · 벡터 · 비용</text>

  <!-- 파이프라인 → S3 -->
  <line x1="1845" y1="338" x2="1845" y2="266" stroke="#16A34A" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#ah-green)"/>
  <text x="1836" y="306" font-size="16" fill="#15803D" text-anchor="end">사례 이미지</text>

  <!-- 파이프라인 → DB -->
  <path d="M1762,582 V1141 H1536" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#ah-green)"/>
  <text x="1786" y="876" font-size="16" fill="#15803D">배치 적재</text>

  <!-- ══════════ 범례 ══════════ -->
  <rect x="35" y="1035" width="316" height="200" rx="12" fill="#F4F4F7" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="66" y1="1086" x2="118" y2="1086" stroke="#111827" stroke-width="2.5" marker-end="url(#ah-dark)"/>
  <text x="138" y="1092" font-size="17" fill="#374151">요청 · 응답</text>
  <line x1="66" y1="1138" x2="118" y2="1138" stroke="#14B8A6" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#ah-teal)"/>
  <text x="138" y="1144" font-size="17" fill="#374151">이미지 전송</text>
  <line x1="66" y1="1190" x2="118" y2="1190" stroke="#16A34A" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#ah-green)"/>
  <text x="138" y="1196" font-size="17" fill="#374151">배치 적재</text>
</svg>
