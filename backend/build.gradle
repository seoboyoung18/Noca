plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ssafy'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // API 문서 · 스웨거 UI. 3.1.0 이 Spring Boot 4 / OpenAPI 3.1 대응 버전이다.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    // S3. BOM 이 버전을 맞춘다. presigner 는 별도 아티팩트가 아니라 s3 모듈에 들어 있다.
    // 자격증명은 기본 체인(로컬 aws configure · 배포 EC2 IAM 역할)을 쓰므로
    // 액세스 키를 설정 파일에 두지 않는다.
    implementation platform('software.amazon.awssdk:bom:2.29.52')
    implementation 'software.amazon.awssdk:s3'

    // ── 검증 결과 PDF (S15P21A307-398) ────────────────────────────────
    // 이 저장소는 새 의존성을 넣지 않는 것을 관례로 지켜 왔다(GMS 호출도 RestClient 로 버텼다).
    // PDF 는 그 관례의 예외다 — JDK 만으로는 PDF 를 만들 수 없다. 대신 최소한만 넣는다.
    //
    // Open HTML to PDF: HTML/CSS → PDF. 내부적으로 PDFBox 를 쓰므로 PDFBox 를 따로 넣지 않는다.
    //   라이선스 LGPL. iText 7 을 쓰지 않은 것은 AGPL 이기 때문이다 — 팀 프로젝트에
    //   AGPL 을 끌어들이면 안 된다. OpenPDF 는 저수준 생성용이라 HTML 변환에 맞지 않고,
    //   PDFBox 단독은 기존 PDF 조작용이다.
    implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'
    // 서버가 HTML 을 만든다. LLM 에게 마크업을 맡기지 않는다(구조화 출력의 mime_type 이
    //   application/json 만이라 HTML 은 스키마를 강제할 수 없고, PDF 는 사용자가 정비소에
    //   들고 갈 문서라 레이아웃을 서버가 통제해야 한다).
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-session-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // 로컬 PostgreSQL 없이 테스트를 돌리기 위한 인메모리 DB (test 런타임 전용)
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
