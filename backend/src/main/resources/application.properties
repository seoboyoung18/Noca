spring.application.name=backend

# -- DB --
spring.datasource.url=jdbc:postgresql://localhost:5432/a307
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# -- Redis / Session --
spring.data.redis.host=localhost
spring.data.redis.port=6379

# spring.session.store-type 은 Boot 4 에서 없어진 키다(메타데이터에 존재하지 않음).
# 클래스패스에 spring-boot-starter-session-data-redis 만 있어 저장소는 자동으로 Redis 가 된다.
#
# 네임스페이스 키도 4.0 부터 spring.session.data.redis.* 로 옮겨졌다. 옛 이름은
# deprecation level=error 라 조용히 무시되고, 세션이 기본 네임스페이스(spring:session)에 쌓인다.
spring.session.data.redis.namespace=a307:session

# indexed 로 두어야 RedisIndexedSessionRepository 가 뜬다. 기본값 default 는
# RedisSessionRepository 라 findByPrincipalName 이 없어서, 탈퇴·강제 로그아웃 때
# 그 회원의 세션을 찾아 끊을 수단이 사라진다.
spring.session.data.redis.repository-type=indexed

# 전역 기본값. 가입 대기 세션은 AuthSessionPolicy 가 세션 단위로 10분으로 줄인다.
server.servlet.session.timeout=30m

# -- OAuth2 / Kakao --
# client-id/secret 은 비어 있으면 기동 실패(Boot 4). 실제 소셜 로그인 붙일 때 환경변수로 주입.

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:changeme}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:changeme}
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.scope=profile_nickname

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# -- OAuth2 / Google --
# provider 블록이 없는 것은 빠진 게 아니다. 구글은 CommonOAuth2Provider.GOOGLE 로
# Spring Security 에 내장돼 있어 authorization-uri·token-uri·user-info-uri·
# user-name-attribute(sub) 가 자동으로 채워진다. 카카오는 내장이 없어 직접 적은 것이다.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:changeme}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:changeme}

# scope 를 반드시 명시한다. 지우면 CommonOAuth2Provider 의 기본값
# "openid, profile, email" 이 적용되는데, 그러면 두 가지가 어긋난다.
#
#  1) openid 가 있으면 Spring Security 가 OIDC 흐름으로 분기해 OidcUserService 를 쓴다.
#     우리 CustomOAuth2UserService 는 DefaultOAuth2UserService 상속이고
#     userInfoEndpoint().userService() 로만 등록돼 있어 호출되지 않는다.
#     회원 조회와 가입 대기 판정이 통째로 건너뛰어진다.
#     openid 를 쓰려면 oidcUserService() 를 따로 등록해야 한다.
#
#  2) email 은 받지 않기로 했다. member.email 은 항상 NULL 이고 저장하는 코드가 없다.
#     카카오도 profile_nickname 만 요청한다.
spring.security.oauth2.client.registration.google.scope=profile

# -- App --
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# CORS 허용 오리진. 쉼표로 구분한다. 여기 값이 코드에 박혀 있으면 배포 순간 전 화면이 막힌다.
# 기본값을 app.frontend-base-url 로 둬서 오리진이 하나뿐인 흔한 경우에는 한 군데만 관리한다.
# 여러 개가 필요하면 CORS_ALLOWED_ORIGINS 로 덮는다.
#   CORS_ALLOWED_ORIGINS=https://a307.example.com,http://localhost:5173
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${app.frontend-base-url}}

management.endpoints.web.exposure.include=health

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# -- 이미지 품질 판정 --
# 요구사항 20행 확인·결정 사항이 "임계값과 최소 해상도는 실험 후 확정" 이다. 아래는 잠정값이다.
# 재빌드 없이 환경변수로 덮을 수 있다(재기동은 필요). 이름은 두 형태 모두 통한다:
#   APP_IMAGEQUALITY_MINSHORTEDGEPX  /  APP_IMAGE_QUALITY_MIN_SHORT_EDGE_PX
# 두 형태를 섞은 이름은 오류 없이 무시된다. 자세한 내용은 ImageQualityProperties Javadoc 참고.
#
# 세 항목은 생략할 수 없다. 빠지면 기동이 실패한다(코드에 기본값을 두지 않았다).
# 값을 바꿀 때 src/test/resources/application.properties 도 같이 고칠 것 —
# 어긋나면 ImageQualityPropertiesTest 가 실패한다.
app.image-quality.enabled=false
app.image-quality.min-short-edge-px=720
app.image-quality.blur-variance-threshold=100.0

# -- Estimate validation deterministic thresholds --
# These are conservative product assumptions until production calibration data is approved.
# 견적서 검증 판정 임계값은 여기 없다 — estimate_validation_rule 테이블이 정본이다.
#   조회 GET  /api/admin/estimate-validation-rules/current
#   변경 PATCH /api/admin/estimate-validation-rules/current  (새 버전을 만들어 즉시 활성화)
# 재배포 없이 바꿀 수 있어야 하고, 과거 판정이 어떤 값으로 내려졌는지 남아야 해서 옮겼다.
# 여기 되돌려 놓으면 공급원이 둘이 되어 어느 쪽이 적용됐는지 알 수 없게 된다.
app.estimate-validation.presigned-url-minutes=10


# -- 사고 이미지 업로드·전처리 (요구사항 21·22행) --
# 다섯 항목은 생략할 수 없다. 빠지면 기동이 실패한다(AccidentImageProperties 에 기본값을 두지 않았다).
# 이름은 두 형태 모두 통한다: APP_ACCIDENTIMAGE_MAXCOUNTPERACCIDENT
#                          APP_ACCIDENT_IMAGE_MAX_COUNT_PER_ACCIDENT
# 섞은 이름은 오류 없이 무시된다 — ImageQualityProperties Javadoc 과 같은 함정이다.
#
# ★ 장수 상한은 정본 두 곳이 어긋나 있다.
#   요구사항 시트 21행(정본 1순위) — 최대 20장
#   Docs/Api/API 명세서 (바른견적 최신).md — "사진 상한 10장 확정" (촬영 가이드 8방향 + 근접 2장)
#   정본 우선순위에 따라 20으로 두었다. 기획이 10으로 확정하면 이 값만 바꾸면 된다 (answer25 D7).
app.accident-image.max-count-per-accident=20

# 장당 상한. 정본 DDL 의 ck_aia_size(20,971,520)를 넘길 수 없다 —
# 넘기면 S3 에는 올라가고 DB 저장에서 CHECK 위반으로 실패하는 최악의 조합이 된다.
app.accident-image.max-file-size-bytes=20971520

# 리사이즈본 긴 변 상한(px). 요구사항에 수치가 없는 잠정값이다 (answer25 5장에 근거 기록).
app.accident-image.resized-max-edge-px=1600
app.accident-image.thumbnail-max-edge-px=320

# presigned 업로드 URL 유효시간. app.estimate-validation.presigned-url-minutes 와 같은 형태다.
app.accident-image.presigned-url-minutes=10

# 조회용 presigned GET URL 유효시간(분). 업로드용과 별개다 — 화면이 열려 있는 동안 쓰이므로
# 너무 짧으면 이미지가 깨지고, 너무 길면 URL 유출 시 노출 창이 길어진다.
app.accident-image.download-url-minutes=10

# 프로필 이미지 (S15P21A307-89)
# 버킷·리전은 팀 S3 안내 기준. 액세스 키는 두지 않는다 — 자격증명은 AWS 기본 체인
# (로컬 aws configure, 배포 EC2 IAM 역할)에서 온다.
# 값이 비어 있으면 S3 어댑터 빈이 만들어지지 않고 이미지 API 가 503 을 낸다.
app.profile-image.region=${AWS_REGION:ap-northeast-2}
app.profile-image.staging-bucket=${PROFILE_IMAGE_STAGING_BUCKET:}
app.profile-image.service-bucket=${PROFILE_IMAGE_SERVICE_BUCKET:}
# 사고 이미지(20MB)보다 작게 잡는다 — 프로필은 작은 크기로 소비된다
app.profile-image.max-file-size-bytes=5242880
app.profile-image.presigned-url-minutes=10

# ─── GMS 경유 LLM 호출 계층 ──────────────────────────────────
# ★ GMS Key 는 절대 이 파일에 쓰지 않는다. 환경변수 GMS_KEY 참조만 둔다.
#   GMS 공식 문서: "클라이언트 코드에 하드코딩하지 말고 서버 환경 변수나 전용 KMS 에서
#   불러와 사용하시기 바랍니다."
#   키가 없으면 LLM 계층 빈이 아예 뜨지 않고, 애플리케이션은 정상 기동한다.
#   소비처는 Optional<LlmChatPort> 로 받아 없으면 503 을 준다 — 기존 관례 그대로다.
#
# 환경변수 이름은 두 형태 모두 통하고 섞은 이름은 오류 없이 무시된다.
#   app.gms.base-url   APP_GMS_BASEURL   또는 APP_GMS_BASE_URL
#   app.gms.max-attempts  APP_GMS_MAXATTEMPTS 또는 APP_GMS_MAX_ATTEMPTS
#
# GMS 는 프록시다. 벤더 엔드포인트의 호스트·경로를 base-url 뒤에 그대로 붙이고,
# 벤더 API 키 자리에 GMS Key 를 넣는다. 요청 본문은 벤더 원본과 완전히 같다.
#   OPENAI → {base}/api.openai.com/v1/responses                    (Authorization: Bearer)
#   GEMINI → {base}/generativelanguage.googleapis.com/v1beta/...    (x-goog-api-key)
app.gms.api-key=${GMS_KEY:}
app.gms.base-url=https://gms.ssafy.io/gmsapi
# 기본이 GEMINI 인 이유는 첨부 형식이다. 이미지와 PDF 를 inline_data 하나로 받아
# 첨부 종류마다 요청 모양이 갈리지 않는다.
app.gms.provider=${GMS_PROVIDER:GEMINI}
app.gms.model=${GMS_MODEL:gemini-2.5-flash}
# 타임아웃에 기본값을 두지 않는다. 무한 대기가 되면 워커 스레드가 통째로 멈춘다.
app.gms.connect-timeout=PT10S
app.gms.read-timeout=PT60S
# 출력 토큰 상한. 크레딧 보호 장치다.
app.gms.max-output-tokens=8192
# 재시도 상한. 429·5xx·타임아웃에만 재시도하고 400 계열은 하지 않는다 —
# 팀 공유 키라 실패한 재시도가 남의 실습을 막는다.
app.gms.max-attempts=2
# 잔여 크레딧이 이 값 미만이면 호출하지 않고 거절한다. 팀이 정할 값이다.
app.gms.min-remain-credit=1
# key-info 캐시 수명. 요청마다 부르면 그 자체가 호출이다.
app.gms.key-info-cache-ttl=PT5M

# ─── 카카오 로컬(Local) REST API ─────────────────────────────
# 주소↔좌표 변환과 장소 검색. FE 지도가 그릴 좌표·장소 데이터를 서버가 내려준다.
#
# ⚠️ 여기 있는 것은 REST API 키다. 지도 렌더링용 JavaScript 키는 FE 몫이고
#    서버는 그것을 보관하지도 응답으로 내보내지도 않는다 (키가 새는 통로를 늘리지 않는다).
#
# 기본값이 빈 문자열인 것은 의도다. changeme 같은 가짜 값을 넣으면 키가 있는 것으로
# 오인해 KakaoKeyPresentCondition 이 빈을 띄우고, 첫 호출에서야 -401 을 받는다.
# 키가 없으면 이 계층 빈이 뜨지 않고 위치 API 만 503 이다 — 기동은 성공한다.
#
# 환경변수 이름은 두 형태 모두 통하고 섞은 이름은 오류 없이 무시된다.
#   app.kakao.local.base-url      APP_KAKAO_LOCAL_BASEURL     또는 APP_KAKAO_LOCAL_BASE_URL
#   app.kakao.local.max-attempts  APP_KAKAO_LOCAL_MAXATTEMPTS 또는 APP_KAKAO_LOCAL_MAX_ATTEMPTS
app.kakao.local.rest-api-key=${KAKAO_REST_API_KEY:}
app.kakao.local.base-url=https://dapi.kakao.com
# 타임아웃에 기본값을 두지 않는다. 무한 대기가 되면 요청 스레드가 통째로 멈춘다.
app.kakao.local.connect-timeout=PT5S
app.kakao.local.read-timeout=PT10S
# 재시도 상한. 카카오 code -1·-603 과 전송 타임아웃에만 재시도한다 —
# 쿼터 초과(-10)나 파라미터 오류(-2)를 재시도하면 일일 허용 회수만 더 태운다.
app.kakao.local.max-attempts=2


# ─── 견적서 문서 저장소 (P1) ─────────────────────────────────
# 값을 주지 않으면 어댑터 빈이 뜨지 않고, 파일 업로드는 지금까지처럼 503 이다.
# 기본값을 코드에 두지 않은 것은 의도다 — 저장소가 조용히 켜지면 어디에 쌓이는지 모른 채
# 개인정보가 담긴 견적서가 디스크에 남는다. 켜는 사람이 위치를 직접 정하게 한다.
#
#   app.document-storage.provider=local
#   app.document-storage.local.root=./var/estimate-documents
#
# local 은 개발·데모용이다. 인스턴스마다 디스크가 다르므로 워커가 다른 서버에서 돌면 읽지 못한다.
# 운영은 S3 어댑터로 교체해야 하며 S15P21A307-217(버킷·IAM)이 선행이다.
app.document-storage.provider=${DOCUMENT_STORAGE_PROVIDER:}
app.document-storage.local.root=${DOCUMENT_STORAGE_LOCAL_ROOT:./var/estimate-documents}

# ─── 견적서 파일 검증 워커 (P3) ──────────────────────────────
# enabled=true 가 아니면 워커도 처리기도 뜨지 않고, 파일 검증은 QUEUED 에 머문다.
# 켜려면 문서 저장소(app.document-storage)와 판독 어댑터(app.estimate-ocr)가 함께 있어야 한다 —
# 없으면 기동이 실패한다. 큐를 비우지 못하면서 실패만 쌓는 워커보다 그 편이 낫다.
#
# poll-interval  : 주기. fixedDelay 라 이전 주기가 끝난 뒤 이만큼 쉬고 다시 돈다
# initial-delay  : 기동 직후 첫 주기까지. 컨텍스트가 다 뜨기 전에 큐를 건드리지 않게 둔다
# batch-size     : 한 주기에 집는 최대 건수. 크게 잡으면 한 주기가 길어져 다음 주기가 밀린다
# processing-timeout : 이만큼 지나도 PROCESSING 인 건은 고아로 보고 FAILED 로 종결한다.
#                      재시도 횟수를 셀 열이 없어 QUEUED 로 되돌리면 무한 재시도가 된다
app.estimate-worker.enabled=${ESTIMATE_WORKER_ENABLED:false}
app.estimate-worker.poll-interval=PT5S
app.estimate-worker.initial-delay=PT10S
app.estimate-worker.batch-size=5
app.estimate-worker.processing-timeout=PT10M

# ─── 정비 체크리스트 생성 워커 (S15P21A307-460) ────────────────────────────
# QUEUED 로 접수된 체크리스트를 집어 LLM 으로 항목을 만든다. 견적서 검증 워커와 같은 폴링
# 구조이고, 켜는 스위치 하나로 워커와 @EnableScheduling 이 함께 붙는다.
#
# ★ 켜도 GMS_KEY 가 없으면 생성 요청 자체가 503 이다(RepairChecklistRequestService).
#   키가 없는 환경에서 기동이 막히지는 않는다 — GmsKeyPresentCondition 이 LLM 빈만 거른다.
#
# processing-timeout : 이만큼 지나도 PROCESSING 인 건은 고아로 보고 FAILED 로 종결한다.
#                      재시도 횟수를 셀 열이 없어 QUEUED 로 되돌리면 무한 재시도가 된다.
#                      LLM 한 번이 수 초라 넉넉히 잡는다.
app.repair-checklist.enabled=${REPAIR_CHECKLIST_WORKER_ENABLED:false}
app.repair-checklist.poll-interval=PT5S
app.repair-checklist.initial-delay=PT15S
app.repair-checklist.batch-size=3
app.repair-checklist.processing-timeout=PT5M

# ─── 정비소 확인 질문 생성 워커 (S15P21A307-477) ───────────────────────────
# QUEUED 로 접수된 질문 목록을 집어 LLM 으로 질문을 만든다. 바로 위 체크리스트 워커와 같은
# 폴링 구조이고, 켜는 스위치 하나로 워커와 @EnableScheduling 이 함께 붙는다.
# 두 기능은 같은 화면(정비 체크리스트 > 질문 생성)에 나란히 붙지만 스위치는 따로 둔다 —
# 한쪽만 켜 두고 보는 일이 있고, 함께 켜져도 스케줄러는 하나만 만들어진다.
#
# ★ 켜도 GMS_KEY 가 없으면 생성 요청 자체가 503 이다(RepairQuestionRequestService).
#   키가 없는 환경에서 기동이 막히지는 않는다 — GmsKeyPresentCondition 이 LLM 빈만 거른다.
#
# processing-timeout : 이만큼 지나도 PROCESSING 인 건은 고아로 보고 FAILED 로 종결한다.
#                      재시도 횟수를 셀 열이 없어 QUEUED 로 되돌리면 무한 재시도가 된다.
app.repair-question.enabled=${REPAIR_QUESTION_WORKER_ENABLED:false}
app.repair-question.poll-interval=PT5S
app.repair-question.initial-delay=PT15S
app.repair-question.batch-size=3
app.repair-question.processing-timeout=PT5M

# ─── 견적서 판독(LLM) 어댑터 (P4) ────────────────────────────
# provider 를 주지 않으면 어댑터 빈이 뜨지 않고, 워커를 켤 수 없다(기동 실패).
#
# SSAFY GMS 는 LLM 이 아니라 프록시다. 벤더의 원래 엔드포인트 앞에 base-url 을 붙이고
# 벤더의 키 자리에 GMS 키를 넣는 것이 전부이며, 요청 본문은 벤더 원본 그대로다.
#   openai → {base-url}/api.openai.com/v1/chat/completions           (Authorization: Bearer)
#   gemini → {base-url}/generativelanguage.googleapis.com/v1beta/...  (x-goog-api-key)
# 인증 헤더 이름이 벤더마다 다르므로 LlmVendor 가 URL 과 헤더를 함께 갖는다.
#
# 기본값이 gemini 인 이유는 PDF 다. EstimateFileValidator 는 jpg·png·pdf 를 받는데
# PDF 를 인라인으로 그대로 받는 것은 gemini 뿐이다. openai 로 PDF 를 처리하려면 페이지를
# 이미지로 렌더해야 하고 그건 새 의존성이라 이 작업의 범위가 아니다 — openai 를 고른 채
# PDF 가 오면 FAILED("PDF는 현재 공급자에서 지원되지 않습니다.") 로 끝난다.
#
# ★ 키는 환경변수 GMS_KEY 로만 들어온다. 여기에 값을 적지 않는다.
#   팀 공용 키이고 크레딧과 만료일이 있다. 실패한 호출도 크레딧을 태우므로
#   max-attempts 를 낮게 둔다(기본 2). 401·402·403 은 재시도하지 않는다.
app.estimate-ocr.provider=${ESTIMATE_OCR_PROVIDER:}
app.estimate-ocr.base-url=https://gms.ssafy.io/gmsapi
app.estimate-ocr.model=${ESTIMATE_OCR_MODEL:gemini-2.5-flash}
app.estimate-ocr.api-key=${GMS_KEY:}
app.estimate-ocr.timeout=PT60S
app.estimate-ocr.max-attempts=2
# 이 값 미만인 항목은 버린다. 모델이 스스로 매긴 값이라 화면에는 내보내지 않는다.
app.estimate-ocr.min-confidence=0.3
app.estimate-ocr.max-output-tokens=8192

# ─── 검증 요약 LLM 생성 (P5, 선택) ───────────────────────────
# 켜지 않으면 요약은 지금까지처럼 규칙 기반 템플릿 문자열이고 llm_model 은 null 이다.
# 접속 정보(기준 URL·모델·키)는 app.estimate-ocr.* 를 그대로 쓴다 — 같은 GMS 키로 같은
# 게이트웨이를 부르므로 설정을 두 벌 두면 어긋나기만 한다.
#
# 검증 한 건마다 판독에 더해 호출이 한 번 더 늘어 크레딧을 더 쓴다. 실패하면 재시도하지 않고
# 템플릿 요약으로 조용히 되돌아간다 — 요약 때문에 검증 전체가 실패하면 안 된다.
app.estimate-summary.enabled=${ESTIMATE_SUMMARY_ENABLED:false}

# ─── 공용 오브젝트 저장소 (S3) ────────────────────────────────
# 팀에 버킷은 두 개뿐이고 프로필 이미지·사고 이미지·견적 문서·검증 PDF 가 그 둘을 나눠 쓴다.
# 도메인마다 이름공간을 따로 두면 같은 버킷을 가리키는 설정이 여러 벌이 되어 조용히 어긋난다.
#
#   staging : 업로드 격리용. 브라우저가 presigned PUT 으로 직접 올린다. ★ 7일 뒤 자동 삭제
#   service : 서비스 본문. 검증 통과본·프로필 이미지·견적서 원본·검증 PDF
#
# ★ 리전을 비워 두지 않는다. 비우면 SDK 가 버킷 위치를 물어보려고 GetBucketLocation 을
#   부르는데 팀 IAM 정책에 그 액션이 없어 AccessDenied 로 죽는다.
# ★ 액세스 키를 여기 두지 않는다. 자격증명은 AWS 기본 체인(로컬 aws configure,
#   배포 서버 EC2 IAM 역할)에서만 온다.
# 버킷 기본값이 비어 있으므로 설정 없는 로컬·테스트에서는 S3 어댑터가 뜨지 않는다.
app.object-storage.region=${AWS_REGION:ap-northeast-2}
app.object-storage.staging-bucket=${STORAGE_STAGING_BUCKET:}
app.object-storage.service-bucket=${STORAGE_SERVICE_BUCKET:}

# ★ app.profile-image.region / staging-bucket / service-bucket 은 위 app.object-storage.*
#   와 같은 버킷을 가리키는 두 번째 설정이다. 지금 지우거나 옮기지 않았다 —
#   member/image/S3ProfileImageStorage 가 그 이름을 쓰고 있고, 그 코드는 담당이 다르다.
#   ProfileImageProperties Javadoc 이 요청한 이관은 소유자와 협의한 뒤에 한다.
#   그때까지 두 벌을 같은 값으로 유지해야 한다 — 하나만 바꾸면 조용히 어긋난다.

# ─── 검증 결과 PDF (S15P21A307-398 · -399 · -400 · -401 · -392 · -289) ──
# enabled=true 가 아니면 생성기·처리기·워커·스케줄러가 전부 뜨지 않고,
# GET /pdf 는 지금까지처럼 409 다. 켜려면 문서 저장소가 함께 있어야 한다 —
#   app.document-storage.provider=s3  +  app.object-storage.service-bucket
# 없으면 기동이 실패한다. 큐를 비우지 못하면서 실패만 쌓는 워커보다 그 편이 낫다.
#
# poll-interval  : 주기. fixedDelay 라 이전 주기가 끝난 뒤 이만큼 쉬고 다시 돈다
# initial-delay  : 기동 직후 첫 주기까지
# batch-size     : 한 주기에 집는 최대 건수. ★ 작게 잡는다 — 한 건마다 LLM 호출이 들어가고
#                  그 계층의 read timeout 이 60초, 재시도가 2회다. 최악의 경우 한 건에 2분이다
# processing-timeout : 이만큼 지나도 PROCESSING 인 건은 고아로 보고 회수한다.
#                  LLM 호출 시간을 감안해 넉넉히 잡는다. retry_count 가 있어 무한 반복되지 않는다
app.validation-pdf.enabled=${VALIDATION_PDF_ENABLED:false}
app.validation-pdf.poll-interval=PT10S
app.validation-pdf.initial-delay=PT15S
app.validation-pdf.batch-size=3
app.validation-pdf.processing-timeout=PT10M

# -- 견적 PDF 생성 워커 (S15P21A307-339) --
# 켜면 QUEUED 인 estimate_report 를 집어 사고 분석 견적 리포트를 PDF 로 만든다.
# 요청·상태 조회 API 는 꺼져 있어도 동작한다 — 요청이 QUEUED 로 남을 뿐이다.
# 저장은 app.object-storage.service-bucket 이 있을 때만 된다. 없으면 건마다 FAILED(보관소 미준비).
# batch-size : 검증 PDF 와 달리 LLM 호출이 없어 더 크게 잡는다
app.estimate-pdf.enabled=${ESTIMATE_PDF_ENABLED:false}
app.estimate-pdf.poll-interval=PT10S
app.estimate-pdf.initial-delay=PT15S
app.estimate-pdf.batch-size=5
app.estimate-pdf.processing-timeout=PT5M

# -- 사례 이미지 조회 (AI-Hub 유사 사례) --
# 파이프라인이 미리 적재한 정적 이미지라 업로드 설정이 없다. 조회 URL 유효시간만 둔다.
# 목록은 화면이 열려 있는 동안 계속 보이므로 업로드 URL(10분)보다 짧을 이유가 없다.
app.repair-case-image.download-url-minutes=10

# -- 내부 API · AI 서버 → 백엔드 결과 수신 (S15P21A307-157) --
# AI 서버가 분석을 마치고 POST /internal/analysis-jobs/{jobId}/result 를 부를 때 쓰는
# 공유 비밀이다. 세션이 없는 호출자라 이 값이 인증 수단이다.
#
# ★ 비워 두면 그 경로가 전부 404 가 된다. 빈 문자열을 "설정됨" 으로 보지 않는다 —
#   그러면 아무 토큰이나 통과하는 구멍이 된다. 로컬에서 callback 을 시험하려면
#   IntelliJ 실행 구성의 Environment variables 에 INTERNAL_API_TOKEN 을 넣는다.
#
# ★ 저장소에 값을 두지 않는다. 운영은 환경변수로 주입하고, 명령줄이 아니라 파일로 넣는다
#   (명령줄에 적으면 ps 에 보인다). 배포 준비 체크리스트 3장의 환경변수 목록에 추가할 것.
#
# 이 경로는 네트워크로도 막는다(EC2 사설 IP). 토큰은 네트워크가 뚫렸을 때의 마지막 문이다.
app.internal-api.token=${INTERNAL_API_TOKEN:}

# -- 견적 항목 신뢰도 판정 (S15P21A307-291 · S15P21A307-205) --
# estimate_item.is_low_confidence 를 정하는 기준. 화면은 참인 항목에 경고를 붙인다.
# 둘 중 하나만 걸려도 낮은 신뢰도다 — 근거가 약해지는 경로가 둘이기 때문이다.
#
# min-ref-cases : 통계 산정에 쓴 사례가 이 건수 미만이면 낮은 신뢰도.
#   ★ 저장소 어디에도 기준이 없어 임의로 정한 출발값이다(2026-09-14). 실제 사례 분포를
#     보고 조정해야 한다. 계약 예시의 refCaseCount 는 18 이라 정상 경로는 대개 통과한다.
#   ※ 계약의 "referencedCaseIds 는 항목당 최대 10건" 과는 다른 값이다 — 그쪽은 화면에
#     보여 줄 대표 사례 수이고, 이쪽은 통계 산정에 쓴 전체 건수다.
#
# warn-from-stage : 이 완화 단계 "이상" 넓혔으면 낮은 신뢰도. MODEL · CAR_CLASS · ALL.
#   ★ ALL 로 두는 이유 — ConfidenceGrade 의 LOW 정의("참조 사례가 적거나 전체 범위까지
#     완화했다")와 같은 기준이다. 그리고 AI 계약이 "현재 DEV corpus 는 모델 매핑 전이므로
#     CAR_CLASS 부터 사용" 이라고 적고 있어, CAR_CLASS 로 두면 지금은 모든 항목에 경고가
#     떠 경고가 정보를 주지 못한다.
#   ※ 모델 매핑이 적재돼 MODEL 이 실제로 쓰이기 시작하면 CAR_CLASS 가 "한 단계 완화" 가
#     된다. 그때 이 값을 CAR_CLASS 로 내릴지 다시 정해야 한다.
app.estimate-confidence.min-ref-cases=5
app.estimate-confidence.warn-from-stage=ALL
