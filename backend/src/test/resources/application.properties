# 로컬 PostgreSQL 없이 도는 테스트 환경.
# schema-h2.sql 로 스키마를 만든 뒤 Hibernate 가 validate 로 Entity 매핑을 검증한다.
spring.datasource.url=jdbc:h2:mem:a307;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.generate_statistics=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# -- OAuth2 / 소셜 로그인 --
# SecurityConfig 의 oauth2Login 이 ClientRegistrationRepository 빈을 요구하고,
# 그 빈은 아래 프로퍼티에서 만들어진다. 이 파일이 main 쪽 application.properties 를 가리므로
# 여기에 없으면 빈이 생기지 않고 시큐리티 필터체인이, 이어서 컨텍스트 전체가 실패한다.
#
# 값은 전부 더미다. 테스트는 카카오 서버와 통신하지 않는다 — 인증 왕복이 필요한 테스트는
# OAuth2User 를 직접 만들어 넣는다. 실제 값은 main 쪽에서 환경변수로 주입된다.
spring.security.oauth2.client.registration.kakao.client-id=test-client-id
spring.security.oauth2.client.registration.kakao.client-secret=test-client-secret
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.scope=profile_nickname

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# -- 이미지 품질 판정 --
# 테스트 클래스패스의 application.properties 가 main 쪽을 가리므로(같은 이름) 여기에도 있어야 한다.
# 없으면 @ConfigurationPropertiesScan 이 등록한 ImageQualityProperties 바인딩이
# min-short-edge-px=0 으로 검증에 걸려 @SpringBootTest 컨텍스트가 통째로 뜨지 않는다.
# main 쪽과 값이 어긋나면 ImageQualityPropertiesTest 가 잡는다.
app.image-quality.enabled=false
app.image-quality.min-short-edge-px=720
app.image-quality.blur-variance-threshold=100.0

# -- Estimate validation deterministic thresholds --
# 견적서 검증 판정 임계값은 여기 없다 — estimate_validation_rule 테이블이 정본이다.
#   조회 GET  /api/admin/estimate-validation-rules/current
#   변경 PATCH /api/admin/estimate-validation-rules/current  (새 버전을 만들어 즉시 활성화)
# 재배포 없이 바꿀 수 있어야 하고, 과거 판정이 어떤 값으로 내려졌는지 남아야 해서 옮겼다.
# 여기 되돌려 놓으면 공급원이 둘이 되어 어느 쪽이 적용됐는지 알 수 없게 된다.
app.estimate-validation.presigned-url-minutes=10

# -- 사고 이미지 업로드·전처리 (요구사항 21·22행) --
# 다섯 항목은 생략할 수 없다. 빠지면 기동이 실패한다(AccidentImageProperties 에 기본값을 두지 않았다).
# 이름은 두 형태 모두 통한다: APP_ACCIDENTIMAGE_MAXCOUNTPERACCIDENT
#                          APP_ACCIDENT_IMAGE_MAX_COUNT_PER_ACCIDENT
# 섞은 이름은 오류 없이 무시된다 — ImageQualityProperties Javadoc 과 같은 함정이다.
#
# ★ 장수 상한은 정본 두 곳이 어긋나 있다.
#   요구사항 시트 21행(정본 1순위) — 최대 20장
#   Docs/Api/API 명세서 (바른견적 최신).md — "사진 상한 10장 확정" (촬영 가이드 8방향 + 근접 2장)
#   정본 우선순위에 따라 20으로 두었다. 기획이 10으로 확정하면 이 값만 바꾸면 된다 (answer25 D7).
app.accident-image.max-count-per-accident=20

# 장당 상한. 정본 DDL 의 ck_aia_size(20,971,520)를 넘길 수 없다 —
# 넘기면 S3 에는 올라가고 DB 저장에서 CHECK 위반으로 실패하는 최악의 조합이 된다.
app.accident-image.max-file-size-bytes=20971520

# 리사이즈본 긴 변 상한(px). 요구사항에 수치가 없는 잠정값이다 (answer25 5장에 근거 기록).
app.accident-image.resized-max-edge-px=1600
app.accident-image.thumbnail-max-edge-px=320

# presigned 업로드 URL 유효시간. app.estimate-validation.presigned-url-minutes 와 같은 형태다.
app.accident-image.presigned-url-minutes=10
app.accident-image.download-url-minutes=10

# 프로필 이미지. 버킷을 비워 두면 S3 어댑터 빈이 만들어지지 않아
# 테스트가 AWS 자격증명을 요구하지 않는다 — 이미지 API 는 503 이 된다.
app.profile-image.region=ap-northeast-2
app.profile-image.staging-bucket=
app.profile-image.service-bucket=
app.profile-image.max-file-size-bytes=5242880
app.profile-image.presigned-url-minutes=10

# -- GMS 경유 LLM 호출 계층 --
# 테스트 클래스패스의 application.properties 가 main 쪽을 가리므로(같은 이름) 여기에도 있어야
# 한다. 없으면 @ConfigurationPropertiesScan 이 등록한 GmsProperties 바인딩이 검증에 걸려
# @SpringBootTest 컨텍스트가 통째로 뜨지 않는다 — ImageQualityProperties Javadoc 의 그 함정이다.
#
# ★ api-key 를 비워 둔다. 그래야 GmsKeyPresentCondition 이 걸려 LLM 계층 빈이 뜨지 않고,
#   "키가 없어도 애플리케이션이 정상 기동한다" 는 요구가 테스트에서 실제로 지켜진다.
#   테스트는 GMS 를 부르지 않는다. 값은 전부 더미다.
app.gms.api-key=
app.gms.base-url=https://gms.ssafy.io/gmsapi
app.gms.provider=GEMINI
app.gms.model=gemini-2.5-flash
app.gms.connect-timeout=PT1S
app.gms.read-timeout=PT2S
app.gms.max-output-tokens=1024
app.gms.max-attempts=2
app.gms.min-remain-credit=1
app.gms.key-info-cache-ttl=PT5M

# -- 카카오 로컬 REST API --
# ★ rest-api-key 를 비워 둔다. 그래야 KakaoKeyPresentCondition 이 걸려 전송 계층 빈이 뜨지
#   않고, "키가 없어도 애플리케이션이 정상 기동하고 위치 API 만 503" 이라는 요구가 테스트에서
#   실제로 지켜진다. 전송 계층 자체는 MockRestServiceServer 로 직접 조립해 검증한다.
#   base-url·타임아웃은 @ConfigurationPropertiesScan 이 키와 무관하게 바인딩·검증하므로
#   값이 있어야 한다. 값은 전부 더미이고 테스트는 카카오를 부르지 않는다.
app.kakao.local.rest-api-key=
app.kakao.local.base-url=https://dapi.kakao.com
app.kakao.local.connect-timeout=PT1S
app.kakao.local.read-timeout=PT2S
app.kakao.local.max-attempts=2

# -- 공용 오브젝트 저장소 --
# 버킷을 비워 두면 S3 어댑터 빈이 만들어지지 않아 테스트가 AWS 자격증명을 요구하지 않는다.
# provider 도 비워 두므로 local·s3 어느 쪽도 뜨지 않고, 파일 업로드는 503 이다.
app.object-storage.region=ap-northeast-2
app.object-storage.staging-bucket=
app.object-storage.service-bucket=
app.document-storage.provider=

# -- 워커 두 개를 명시적으로 꺼 둔다 --
# 검증 워커(파일 → COMPLETED)와 PDF 워커(COMPLETED → PDF) 둘 다 @Scheduled 폴링이다.
# 테스트 중 임의로 돌면 같은 행을 두고 경쟁해 다른 테스트가 흔들린다.
# havingValue="true" 라 값이 없어도 뜨지 않지만, 꺼져 있다는 사실을 설정에 남긴다.
# (PDF 워커는 -398 브랜치의 산출물이라 이 브랜치에 클래스가 없다. 그 브랜치가 합쳐져도
#  테스트에서 켜지지 않도록 스위치를 미리 둔다.)
app.estimate-worker.enabled=false
app.validation-pdf.enabled=false

# 체크리스트 생성 워커(S15P21A307-460)도 같은 이유로 꺼 둔다. 켜져 있으면 LLM 어댑터가 없는
# 테스트 환경에서 접수분을 집어 FAILED 로 적어 버려, 상태를 단언하는 테스트가 흔들린다.
# 워커를 실제로 돌려 보는 테스트는 @SpringBootTest(properties=...) 로 자기만 켠다.
app.repair-checklist.enabled=false

# CORS — 운영과 같은 키를 둔다. 없으면 @Validated 가 기동을 막는다.
app.cors.allowed-origins=http://localhost:5173

# -- 사례 이미지 조회 --
# main 쪽과 같은 이름의 파일이라 여기에도 있어야 한다. 없으면 RepairCaseImageProperties
# 바인딩이 검증에 걸려 @SpringBootTest 컨텍스트가 통째로 뜨지 않는다.
app.repair-case-image.download-url-minutes=10
# -- 내부 API 토큰. 테스트는 이 값을 헤더로 보낸다 (S15P21A307-157) --
app.internal-api.token=test-internal-token

# -- 신뢰도 판정 기준. 본 설정과 같은 값을 쓴다 (S15P21A307-291) --
# 값이 갈라지면 LowConfidenceRuleDefaultsTest 가 깨진다.
app.estimate-confidence.min-ref-cases=5
app.estimate-confidence.warn-from-stage=ALL
