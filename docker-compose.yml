# A307 로컬 개발 인프라 — PostgreSQL(pgvector) + Redis
#
# 애플리케이션은 여기 없다. IDE·gradle 로 띄우고 이 두 컨테이너에만 붙는다.
#
# 사용법
#   docker compose up -d          기동
#   docker compose down           정지 (데이터는 named volume 에 남는다)
#   docker compose down -v        정지 + 데이터 삭제 (DDL 을 다시 적용하고 싶을 때)
#
# 계정 정보는 아래 기본값을 그대로 쓰면 된다. 별도 파일을 만들 필요가 없다.
#   DB_USERNAME=a307  DB_PASSWORD=ssafy  DB_PORT=5432  REDIS_PORT=6379
#
# 이미 5432 나 6379 를 쓰는 것이 PC 에 있으면 기동이 실패한다. 그럴 때만 루트에 .env 를
# 만들어 포트를 바꾼다(.gitignore 처리돼 있어 남의 diff 를 건드리지 않는다).
#   DB_PORT=15432
#   REDIS_PORT=16379
# 애플리케이션 쪽 spring.datasource.url · spring.data.redis.port 도 같이 맞춰야 한다.
#
# 이 값이 리포지토리에 있어도 되는 이유는 포트를 127.0.0.1 에만 묶었기 때문이다.
# 같은 네트워크의 다른 기기에서는 붙을 수 없다. 운영 DB 는 이 파일을 쓰지 않는다.
# 다른 값을 쓰고 싶으면 루트에 .env 를 만들어 덮으면 된다(.gitignore 처리돼 있다).
#
# 애플리케이션에도 같은 값이 필요하다. compose 는 .env 를 읽지만 Spring Boot 는 읽지 않으므로,
# IntelliJ 실행 구성의 Environment variables 에 넣는다. 카카오 키도 어차피 거기 들어간다.
#   DB_USERNAME=a307;DB_PASSWORD=a307local;KAKAO_CLIENT_ID=...;KAKAO_CLIENT_SECRET=...

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: a307-db
    environment:
      POSTGRES_DB: a307
      # 이 이름으로 슈퍼유저가 만들어지고, initdb 스크립트도 이 계정으로 실행된다.
      # DDL 첫 줄의 CREATE EXTENSION vector 가 슈퍼유저 권한을 필요로 하는데 그래서 문제없다.
      POSTGRES_USER: ${DB_USERNAME:-a307}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ssafy}
      # 한글 주석이 들어간 DDL 을 그대로 읽으려면 UTF-8 이어야 한다.
      LANG: C.UTF-8
    ports:
      # 127.0.0.1 로 묶는다. "5432:5432" 라고 쓰면 모든 인터페이스에 열려
      # 같은 공유기에 붙은 다른 기기에서도 접근할 수 있다.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - a307-pgdata:/var/lib/postgresql/data
      # docker-entrypoint-initdb.d 는 데이터 디렉터리가 비어 있을 때만(= 첫 기동) 실행된다.
      # 파일명 순서대로 돌아가므로 DDL 이 시드보다 먼저다.
      #
      # DDL 이 바뀌면 이 마운트만으로는 반영되지 않는다. `docker compose down -v` 로
      # 볼륨을 지우고 다시 올려야 한다. 로컬 DB 가 낡아서 ddl-auto=validate 가 실패하는
      # 사고가 이미 한 번 있었으니, DDL 커밋을 pull 하면 이 절차를 밟는다.
      - ./Docs/Erd/A307_ddl_final.sql:/docker-entrypoint-initdb.d/01-ddl.sql:ro
      - ./Docs/Erd/vehicle_model_seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./Docs/Erd/A307_part_code_seed.sql:/docker-entrypoint-initdb.d/03-part-code-seed.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-a307} -d a307"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: a307-redis
    ports:
      # 비밀번호 없이 뜨므로 외부 인터페이스에 열어두면 안 된다.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      # 세션 저장소라 유실돼도 재로그인으로 끝나지만, 컨테이너를 올릴 때마다
      # 전원 로그아웃되는 것을 막으려면 볼륨이 있는 편이 낫다.
      - a307-redisdata:/data
    # spring.session.data.redis.repository-type=indexed 로 두면 부팅 시
    # notify-keyspace-events 를 CONFIG SET 으로 켠다. 기본 설정의 redis 는 이를 허용한다.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  a307-pgdata:
  a307-redisdata:
